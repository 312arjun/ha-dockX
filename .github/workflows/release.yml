name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/set_version.py "${{ github.ref_name }}"

      - name: Build
        run: python build.py --clean

      - name: Zip the build
        run: |
          Compress-Archive -Path "dist/HA Dock/*" -DestinationPath "HA-Dock-${{ github.ref_name }}.zip"
        if: startsWith(github.ref, 'refs/tags/')

      - name: Upload artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: HA-Dock-${{ github.sha }}
          path: dist/HA Dock/
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HA-Dock-${{ github.ref_name }}.zip
          generate_release_notes: true
